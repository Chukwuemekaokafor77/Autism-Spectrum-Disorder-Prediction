services:
  - type: web
    name: asd-screening-tool
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && python train.py
    startCommand: gunicorn -b 0.0.0.0:$PORT run:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
